name: Repair changelog

on:
  workflow_dispatch:
    inputs:
      changelog_file:
        description: Changelog file to update
        required: true
        type: string

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: repair-changelog
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Update and repair
        env:
          ACTIONS_TOKEN: ${{ github.token }}
          CHANGELOG_EXTRA_CATEGORIES: ""
          CHANGELOG_FILE: ${{ inputs.changelog_file }}
          GITHUB_TOKEN: ${{ github.token }}
          MANUAL_CHANGELOG: |
            :ci: E2E-Bot
            fix: Проверка автоматического обновления чейнжлога
        run: bash Tools/_sunrise/changelog/run.sh
